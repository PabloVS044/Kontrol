services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kontrol
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/kontrol.sql:/docker-entrypoint-initdb.d/kontrol.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_REPLICA_HOST: mongo:27017
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-replica-health.js:/scripts/mongo-replica-health.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/scripts/mongo-replica-health.js"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./shared:/shared:ro
      - backend_modules:/app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kontrol
      - MONGODB_URI=mongodb://mongo:27017/kontrol_chat?replicaSet=rs0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - frontend_modules:/app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3000
    depends_on:
      - backend

volumes:
  backend_modules:
  frontend_modules:
  postgres_data:
  mongo_data:
