name: Privacidad P1

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacidad - PostgreSQL y Mongo reales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Iniciar bases desechables y replica set
        run: npm run db:test:up -w backend
      - name: Validar privacidad y cobertura por archivo
        run: npm run test:privacy -w backend
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacidad-p1
          path: |
            backend/reports/privacy-*.json
            backend/reports/privacy-*.xml
            backend/coverage/privacy/
          if-no-files-found: warn
          retention-days: 30
      - name: Detener bases de prueba
        if: always()
        run: npm run db:test:down -w backend
