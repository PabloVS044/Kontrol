name: Integración y regresión

# Tarea 5 — pruebas de integración y de regresión del backend contra un
# PostgreSQL real; ampliadas en el Sprint 10 a los cinco grupos de flujos de
# docs/pruebas-integracion.md. Corre en cada push a develop (la rama de
# integración, es decir, cada merge) y en cada PR dirigido a main o develop.
# workflow_dispatch permite lanzarlo a mano desde la pestaña Actions.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# En un PR, un commit nuevo cancela la corrida anterior. En develop no: cada
# merge deja su propia corrida completa como evidencia de integración continua.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # Un job por tipo de prueba: en el PR se ve por separado si falló la
    # integración entre componentes o se detectó una regresión.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            label: Pruebas de integración (API + PostgreSQL)
          - suite: regression
            label: Pruebas de regresión (API + PostgreSQL)

    # Base de datos desechable para el job. globalSetup la vacía, carga
    # backend/kontrol.sql y aplica ensureDatabaseSchema() antes de las pruebas.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kontrol
          POSTGRES_PASSWORD: kontrol
          POSTGRES_DB: kontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontrol -d kontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://kontrol:kontrol@localhost:5432/kontrol_test
      JWT_SECRET: ci-integration-secret

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Ejecutar pruebas de ${{ matrix.suite }}
        run: npm run test:${{ matrix.suite }} -w backend

      # Mismo Markdown en el resumen del job y en reports/, que se publica
      # como artefacto para adjuntarlo al informe (ver scripts/integration-report.js).
      - name: Resumen de resultados
        if: always()
        working-directory: backend
        run: node scripts/integration-report.js --out reports/${{ matrix.suite }}-report.md ${{ matrix.suite }}

      - name: Publicar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.suite }}
          path: backend/reports/
          retention-days: 30
          if-no-files-found: warn
