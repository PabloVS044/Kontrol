name: P2 - isolated backup restore drill

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/backups/**'
      - 'tests/backups/**'
      - 'backend/kontrol.sql'
      - '.github/workflows/backup-restore-drill.yml'

permissions:
  contents: read

jobs:
  restore:
    # Never use the production VM or a self-hosted/shared test runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/backups/requirements.txt
      - name: Install laboratory dependencies
        run: python -m pip install -r scripts/backups/requirements.txt
      - name: Unit checks (do not count as a restoration)
        run: python -m unittest discover -s tests/backups -v
      - name: Backup, destroy synthetic sources, restore and compare
        run: python scripts/backups/drill.py --output backup-drill-output
      - name: Save only reviewed evidence formats, never archives or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup-drill-output/**/evidence.json
            backup-drill-output/**/evidence.md
          if-no-files-found: warn
          retention-days: 30
