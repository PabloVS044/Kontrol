name: CI

# Solo se valida lo que va a integrarse a una rama protegida:
# pull requests dirigidos a main o develop. Los pushes a ramas de
# trabajo no disparan la suite.
on:
  pull_request:
    branches: [main, develop]

# Si se sube un commit nuevo al PR, cancela el run anterior del mismo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - tests unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage -w backend

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 30
          if-no-files-found: error

  frontend-tests:
    name: Frontend - tests unitarios y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage -w frontend

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Verificar build de producción
        run: npm run build -w frontend
