<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      @font-face { font-family: 'Manrope'; font-weight: 500; src: url('assets/fonts/manrope-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 700; src: url('assets/fonts/manrope-latin-700-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 800; src: url('assets/fonts/manrope-latin-800-normal.woff2') format('woff2'); }
      :root { --ground: #f5f1e9; --ink: #1a1712; --soft: #403a30; --muted: #6b6356; --gold: #936923; --gold-soft: #b27f2a; --line: rgba(147, 105, 35, 0.3); --green: #1f7a43; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Manrope', sans-serif; color: var(--ink); overflow: hidden; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 45% 50% at 47% 55%, rgba(202, 168, 96, 0.12), transparent 70%), var(--ground); }
      .eyebrow { position: absolute; left: 120px; top: 96px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; color: #6e5219; }
      .title { position: absolute; left: 120px; top: 136px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 72px; }
      .title em, .final em { color: var(--gold); }
      .title span, .final span { display: inline-block; }
      svg#wires { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #wires path { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }

      .card { position: absolute; border-radius: 26px; border: 1.5px solid var(--line); background: linear-gradient(160deg, #fffdf8, #f0eadf); box-shadow: 0 24px 60px rgba(70, 52, 20, 0.14); }
      .card .glow { position: absolute; inset: -2px; border-radius: 26px; border: 3px solid var(--gold); box-shadow: 0 0 40px rgba(202, 168, 96, 0.55); opacity: 0; }
      .k { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: #6e5219; }

      #pos { left: 120px; top: 360px; width: 470px; height: 420px; padding: 36px; }
      #pos .item { margin-top: 30px; display: flex; justify-content: space-between; font-size: 34px; font-weight: 700; }
      #pos .item span { color: var(--soft); font-weight: 500; }
      #pos .tot { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-size: 40px; font-weight: 800; }
      #pos .tot b { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 500; }
      #btn { position: absolute; left: 36px; right: 36px; bottom: 36px; height: 84px; border-radius: 18px; background: var(--gold); color: var(--ground); font-size: 34px; font-weight: 800; display: grid; place-items: center; }
      #btn-ok { position: absolute; left: 36px; right: 36px; bottom: 36px; height: 84px; border-radius: 18px; background: rgba(31, 122, 67, 0.16); border: 2px solid var(--green); color: var(--green); font-size: 30px; font-weight: 800; display: grid; place-items: center; opacity: 0; }

      #hub { position: absolute; left: 860px; top: 570px; width: 260px; height: 300px; display: flex; flex-direction: column; align-items: center; }
      #hub svg { width: 200px; height: 220px; color: var(--gold); }
      #hub b { margin-top: 8px; font-size: 30px; font-weight: 800; text-align: center; line-height: 1.15; }
      #hub-glow { position: absolute; left: 50%; top: 110px; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; background: radial-gradient(circle, rgba(202, 168, 96, 0.45), transparent 65%); opacity: 0; }

      .t { left: 1360px; width: 460px; height: 136px; padding: 22px 30px; display: flex; flex-direction: column; justify-content: center; }
      .t .row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
      .t .row span { white-space: nowrap; font-size: 28px; color: var(--soft); font-weight: 500; }
      .t .row b { white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 500; }
      .t .row b.up { color: var(--green); }
      .bars { display: flex; align-items: flex-end; gap: 12px; height: 56px; margin-top: 8px; }
      .bars i { display: block; width: 46px; border-radius: 6px 6px 2px 2px; background: rgba(202, 168, 96, 0.45); }
      .bars i.last { background: var(--gold); }
      .t .ans { font-size: 26px; color: var(--ink); font-weight: 700; margin-top: 6px; }

      .pkt { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--gold-soft); box-shadow: 0 0 18px 6px rgba(178, 127, 42, 0.45); opacity: 0; }
      .final { position: absolute; left: 120px; top: 880px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="eyebrow" class="eyebrow">Todo conectado</div>
      <h1 id="title" class="title"><span>Un</span> <span>dato</span> <span>se</span> <span>registra</span> <span><em>una</em></span> <span><em>vez.</em></span></h1>

      <svg id="wires" viewBox="0 0 1920 1080">
        <path id="w-in" d="M590 680 H880" />
        <path id="s1" d="M1120 640 C1250 640 1250 268 1360 268" />
        <path id="s2" d="M1120 660 C1250 660 1250 436 1360 436" />
        <path id="s3" d="M1120 680 C1250 680 1250 604 1360 604" />
        <path id="s4" d="M1120 700 C1250 700 1250 772 1360 772" />
        <path id="s5" d="M1120 720 C1250 720 1250 940 1360 940" />
      </svg>

      <div id="pos" class="card">
        <div class="k">Punto de venta</div>
        <div class="item">Taladro <span>× 3</span></div>
        <div class="tot">Total <b>Q 1 350</b></div>
        <div id="btn">Cobrar</div>
        <div id="btn-ok">Venta #1042 registrada ✓</div>
        <i class="glow"></i>
      </div>

      <div id="hub">
        <div id="hub-glow"></div>
        <svg viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><ellipse cx="12" cy="5" rx="9" ry="3.2" /><path d="M3 5v15c0 1.8 4 3.2 9 3.2s9-1.4 9-3.2V5M3 12.5c0 1.8 4 3.2 9 3.2s9-1.4 9-3.2" /></svg>
        <b>Una sola<br />base de datos</b>
      </div>

      <div id="t1" class="card t" style="top: 200px">
        <div class="k">Inventario</div>
        <div class="row"><span>Taladro · stock</span><b id="v1">12</b></div>
        <i class="glow"></i>
      </div>
      <div id="t2" class="card t" style="top: 368px">
        <div class="k">Ventas</div>
        <div class="row"><span>Utilidad</span><b id="v2">Q 4 820</b></div>
        <i class="glow"></i>
      </div>
      <div id="t3" class="card t" style="top: 536px">
        <div class="k">Reportes</div>
        <div class="bars"><i style="height: 30px"></i><i style="height: 42px"></i><i style="height: 24px"></i><i style="height: 38px"></i><i id="lastbar" class="last" style="height: 20px"></i></div>
        <i class="glow"></i>
      </div>
      <div id="t4" class="card t" style="top: 704px">
        <div class="k">Dashboard</div>
        <div class="row"><span>Ventas de hoy</span><b id="v4">8</b></div>
        <i class="glow"></i>
      </div>
      <div id="t5" class="card t" style="top: 872px">
        <div class="k">Asistente IA</div>
        <div id="ans" class="ans">«¿Qué se vendió hoy?»</div>
        <i class="glow"></i>
      </div>

      <div id="p0" class="pkt"></div>
      <div id="p1" class="pkt"></div>
      <div id="p2" class="pkt"></div>
      <div id="p3" class="pkt"></div>
      <div id="p4" class="pkt"></div>
      <div id="p5" class="pkt"></div>

      <div id="final" class="final"><span>Un</span> <span>dato.</span> <span>Una</span> <span>base.</span> <span><em>Todo</em></span> <span><em>conectado.</em></span></div>
    </div>
    <script>
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#eyebrow', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2);
      tl.fromTo('#title span', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3, stagger: 0.08, ease: 'power3.out' }, 0.35);

      ['#w-in', '#s1', '#s2', '#s3', '#s4', '#s5'].forEach((id) => {
        const l = document.querySelector(id).getTotalLength();
        tl.set(id, { strokeDasharray: l, strokeDashoffset: l }, 0);
      });

      // La venta
      tl.fromTo('#pos', { opacity: 0, x: -40, filter: 'blur(10px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out' }, 1.1);
      tl.fromTo('#hub', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'expo.out' }, 1.5);
      tl.to('#btn', { scale: 0.94, duration: 0.12, ease: 'power2.in' }, 2.5);
      tl.to('#btn', { scale: 1, opacity: 0, duration: 0.25, ease: 'power2.out' }, 2.62);
      tl.fromTo('#btn-ok', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 2.7);

      // Se guarda una vez
      tl.to('#w-in', { strokeDashoffset: 0, duration: 0.5, ease: 'power2.inOut' }, 3.1);
      tl.set('#p0', { opacity: 1 }, 3.2);
      tl.to('#p0', { motionPath: { path: '#w-in', align: '#w-in', alignOrigin: [0.5, 0.5] }, duration: 0.55, ease: 'power1.inOut' }, 3.2);
      tl.set('#p0', { opacity: 0 }, 3.75);
      tl.fromTo('#hub-glow', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 3.75);
      tl.to('#hub-glow', { opacity: 0.45, duration: 1.2 }, 4.3);

      // Los módulos que lo leen
      tl.fromTo('.t', { opacity: 0, x: 40 }, { opacity: 0.55, x: 0, duration: 0.6, stagger: 0.08, ease: 'expo.out' }, 4.0);

      const fly = (i, at, onArrive) => {
        tl.to(`#s${i}`, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.inOut' }, at);
        tl.set(`#p${i}`, { opacity: 1 }, at + 0.1);
        tl.to(`#p${i}`, { motionPath: { path: `#s${i}`, align: `#s${i}`, alignOrigin: [0.5, 0.5] }, duration: 0.55, ease: 'power1.inOut' }, at + 0.1);
        tl.set(`#p${i}`, { opacity: 0 }, at + 0.65);
        tl.to(`#t${i}`, { opacity: 1, duration: 0.25 }, at + 0.65);
        tl.fromTo(`#t${i} .glow`, { opacity: 0 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 1 }, at + 0.65);
        onArrive(at + 0.65);
      };
      const countTo = (sel, from, to, fmt, at) => {
        const o = { v: from };
        tl.fromTo(o, { v: from }, { v: to, duration: 0.7, ease: 'power2.out', onUpdate: () => (document.querySelector(sel).textContent = fmt(o.v)) }, at);
        tl.set(sel, { color: '#1f7a43' }, at);
      };
      const q = (v) => 'Q ' + Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

      fly(1, 5.0, (t) => countTo('#v1', 12, 9, (v) => String(Math.round(v)), t));
      fly(2, 5.5, (t) => countTo('#v2', 4820, 5225, q, t));
      fly(3, 6.0, (t) => tl.fromTo('#lastbar', { height: 20 }, { height: 56, duration: 0.6, ease: 'expo.out' }, t));
      fly(4, 6.5, (t) => countTo('#v4', 8, 9, (v) => String(Math.round(v)), t));
      fly(5, 7.0, (t) => {
        tl.to('#ans', { opacity: 0, duration: 0.15 }, t + 0.3);
        tl.set('#ans', { textContent: '9 ventas · el Taladro lidera' }, t + 0.45);
        tl.to('#ans', { opacity: 1, color: '#1f7a43', duration: 0.3 }, t + 0.45);
      });

      // Cierre
      tl.fromTo('#final span', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.35, stagger: 0.12, ease: 'power3.out' }, 9.2);
      tl.to({}, { duration: 0.1 }, 14.9);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
